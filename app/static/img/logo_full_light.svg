      <line x1="30" y1="18" x2="30" y2="42" stroke="#D97706" stroke-width="2.5" />
      <line x1="14" y1="34" x2="46" y2="34" stroke="#D97706" stroke-width="2.5" />
      <!-- Trunk -->
      <rect x="22" y="50" width="16" height="15" fill="#D97706" rx="2" />
    </g>
    
  <text x="75" y="48" class="wordmark">ASPEN</text>
    <text x="75" y="68" class="tagline">Algorithmic Spoilage‑Prevention Engine</text>
