<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <style>
      .wordmark { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 28px; fill: #FFFFFF; }
      .tagline  { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #9CA3AF; }
    </style>
  </defs>
  
    <g transform="translate(5, 5)">
      <!-- Canopy -->
