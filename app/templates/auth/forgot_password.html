{% extends "base.html" %}
{% block content %}
{% set form_data = form_data|default({}) %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <span class="bg-leaf rounded-circle p-3 d-inline-block">
                            <i class="bi bi-key fs-2 text-white"></i>
                        </span>
                    </div>
                    <h4 class="text-forest fw-bold">Forgot Password?</h4>
                    <p class="text-muted small">
                        Enter your registered phone number to receive a reset code.
                    </p>

                    <!-- Inline message area for JS validation -->
                    <div id="form-message" class="small mt-3 text-danger d-none"></div>

                    <form id="forgot-form" method="POST" action="{{ url_for('forgot_password_post') }}" autocomplete="off">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small">
                                <i class="bi bi-phone me-1"></i>Phone Number
                            </label>
                            <div class="input-group">
                                <span class="input-group-text phone-prefix d-flex align-items-center" style="background-color: #f8f9fa; border-right: none; padding: 0.375rem 0.75rem;">
                                    <img src="{{ url_for('static', path='img/ghana-flag.png') }}" alt="Ghana flag" style="width: 22px; height: 16px; object-fit: cover; margin-right: 6px;">
                                    <span style="line-height: 1;">+233</span>
                                </span>
                                <input type="tel" name="phone_display" id="phone"
                                       class="form-control"
                                       placeholder="0XX XXX XXXX"
                                       maxlength="12"
                                       inputmode="numeric"
                                       pattern="0[0-9]{2} [0-9]{3} [0-9]{4}"
                                       data-raw-field="phone_raw"
                                       oninput="formatPhoneInput(this)"
                                       autocomplete="off" required>
                                <input type="hidden" name="phone" id="phone_raw" value="{{ form_data.get('phone', '') }}">
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="btn btn-forest w-100 mb-3">
                            Send Reset Code <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <a href="{{ url_for('login_page') }}" class="text-forest fw-bold small">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">
                Issues with phone number? <a href="{{ url_for('support_page') }}" class="text-forest fw-bold">Contact Support</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    // Repopulate display phone from hidden raw value (if present)
    var rawPhone = document.getElementById('phone_raw').value;
    if (rawPhone && rawPhone.length === 10 && /^0\d{9}$/.test(rawPhone)) {
        var formatted = rawPhone.slice(0, 3) + ' ' + rawPhone.slice(3, 6) + ' ' + rawPhone.slice(6);
        document.getElementById('phone').value = formatted;
    }

    // Inline message helper
    var messageEl = document.getElementById('form-message');
    function showError(message) {
        if (!messageEl) return;
        messageEl.textContent = message;
        messageEl.classList.remove('d-none');
    }
    function hideError() {
        if (messageEl) messageEl.classList.add('d-none');
    }

    // Form submission validation & throttling
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
        e.preventDefault();
        hideError();

        var rawPhone = document.getElementById('phone_raw').value.trim();
        // Validate 10-digit Ghana phone number starting with 0
        if (!/^0\d{9}$/.test(rawPhone)) {
            showError('Please enter a valid 10-digit phone number starting with 0.');
            return;
        }

        var btn = document.getElementById('submit-btn');
        if (btn.disabled) return; // already submitting

        // Disable button and show loading state
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

        // Submit the form programmatically
        this.submit();
    });
})();
</script>
{% endblock %}
