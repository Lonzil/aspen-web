{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm text-center">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <span class="bg-leaf rounded-circle p-3 d-inline-block">
                            <i class="bi bi-shield-check fs-2 text-white"></i>
                        </span>
                    </div>
                    <h4 class="text-forest fw-bold">Reset Password</h4>
                    <p class="text-muted small">
                        Enter the code sent to <strong>{{ phone }}</strong> and your new password.
                    </p>

                    {% if config.DEMO_MODE and demo_code %}
                    <div class="alert alert-warning small text-start">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <strong>Demo Code: {{ demo_code }}</strong>
                    </div>
                    {% endif %}

                    <!-- Inline error message area -->
                    <div id="form-error" class="alert alert-danger small text-start d-none mb-3"></div>

                    <form id="reset-form" method="POST" action="{{ url_for('reset_password_post') }}" autocomplete="off">
                        <input type="hidden" name="phone" value="{{ phone }}">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small">
                                <i class="bi bi-hash me-1"></i>Reset Code
                            </label>
                            <input type="text" name="code" id="reset-code" class="form-control"
                                   placeholder="Enter 6‑digit code" maxlength="6"
                                   inputmode="numeric" pattern="[0-9]{6}"
                                   autocomplete="one-time-code"
                                   oninput="this.value = this.value.replace(/\D/g, '')"
                                   required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small">
                                <i class="bi bi-lock me-1"></i>New Password
                            </label>
                            <div class="input-group">
                                <input type="password" name="new_password" id="new_pwd"
                                       class="form-control" minlength="8" maxlength="72" required
                                       autocomplete="new-password">
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('new_pwd')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold small">
                                <i class="bi bi-shield-check me-1"></i>Confirm New Password
                            </label>
                            <div class="input-group">
                                <input type="password" name="confirm_new_password" id="confirm_pwd"
                                       class="form-control" minlength="8" maxlength="72" required
                                       autocomplete="new-password">
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('confirm_pwd')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" id="submit-btn" class="btn btn-forest w-100 mb-3">
                            Reset Password <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <p class="small text-muted mb-0">
                        <span id="resend-timer">Resend in <strong>60s</strong></span>
                        <a href="#" id="resend-link" class="text-forest fw-bold d-none">Resend Code</a>
                    </p>
                    <div id="resend-message" class="small mt-2"></div>

                    <a href="{{ url_for('login_page') }}" class="text-forest fw-bold small d-inline-block mt-3">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// ---------------------------------------------------------------------------
// Password validation
// ---------------------------------------------------------------------------
function validatePassword(password) {
    if (password.length < 8) return "Password must be at least 8 characters long.";
    if (password.length > 72) return "Password must be at most 72 characters long.";
    if (!/[a-z]/.test(password)) return "Password must include at least one lowercase letter.";
    if (!/[A-Z]/.test(password)) return "Password must include at least one uppercase letter.";
    if (!/[0-9]/.test(password)) return "Password must include at least one digit.";
    if (!/[^a-zA-Z0-9]/.test(password)) return "Password must include at least one special character.";
    return null;
}

function togglePassword(id) {
    var field = document.getElementById(id);
    var icon = field.nextElementSibling.querySelector('i');
    field.type = field.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('bi-eye');
    icon.classList.toggle('bi-eye-slash');
}

// ---------------------------------------------------------------------------
// Inline error helpers
// ---------------------------------------------------------------------------
var errorBox = document.getElementById('form-error');
function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('d-none');
}
function hideError() {
    errorBox.textContent = '';
    errorBox.classList.add('d-none');
}

// ---------------------------------------------------------------------------
// Form submission with double-submit prevention & inline validation
// ---------------------------------------------------------------------------
document.getElementById('reset-form').addEventListener('submit', function(e) {
    e.preventDefault();
    hideError();

    var codeInput = document.getElementById('reset-code');
    var newPass = document.getElementById('new_pwd').value;
    var confirmPass = document.getElementById('confirm_pwd').value;
    var submitBtn = document.getElementById('submit-btn');

    // Validate reset code
    if (!/^\d{6}$/.test(codeInput.value)) {
        showError('Please enter a valid 6-digit reset code.');
        return;
    }

    // Validate password policy
    var error = validatePassword(newPass);
    if (error) {
        showError(error);
        return;
    }

    // Check match
    if (newPass !== confirmPass) {
        showError('Passwords do not match.');
        return;
    }

    // Prevent double submission
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';

    // Submit the form programmatically
    this.submit();
});

// ---------------------------------------------------------------------------
// Clear fields on load to avoid autofill
// ---------------------------------------------------------------------------
window.addEventListener('load', function() {
    document.getElementById('reset-code').value = '';
    document.getElementById('new_pwd').value = '';
    document.getElementById('confirm_pwd').value = '';
});

// ---------------------------------------------------------------------------
// Resend code logic
// ---------------------------------------------------------------------------
const timerEl = document.getElementById('resend-timer');
const linkEl = document.getElementById('resend-link');
const messageEl = document.getElementById('resend-message');

let countdownInterval = null;

function hideMessage() {
    if (messageEl) messageEl.textContent = '';
}

function showMessage(text, type = 'success') {
    if (!messageEl) return;
    messageEl.textContent = text;
    messageEl.className = `small mt-2 ${type === 'success' ? 'text-leaf' : 'text-danger'}`;
}

function startCountdown(seconds = 60) {
    if (countdownInterval) clearInterval(countdownInterval);
    let remaining = seconds;

    timerEl.classList.remove('d-none');
    linkEl.classList.add('d-none');
    timerEl.innerHTML = `Resend in <strong>${remaining}s</strong>`;

    countdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(countdownInterval);
            timerEl.classList.add('d-none');
            linkEl.classList.remove('d-none');
            linkEl.style.pointerEvents = 'auto';
            linkEl.textContent = 'Resend Code';
        } else {
            timerEl.innerHTML = `Resend in <strong>${remaining}s</strong>`;
        }
    }, 1000);
}

async function handleResend(e) {
    e.preventDefault();
    if (linkEl.style.pointerEvents === 'none') return; // Prevent double-click

    hideMessage();

    const phoneInput = document.querySelector('input[name="phone"]');
    if (!phoneInput || !phoneInput.value.trim()) {
        showMessage('Phone number is missing. Please go back and try again.', 'error');
        return;
    }

    // Disable link while request is running
    linkEl.style.pointerEvents = 'none';
    linkEl.textContent = 'Sending...';

    try {
        const formBody = new URLSearchParams();
        formBody.append('phone', phoneInput.value.trim());

        const resp = await fetch('/forgot-password/resend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formBody.toString(),
            credentials: 'include'
        });

        const data = await resp.json();

        if (resp.ok) {
            const phone = encodeURIComponent(phoneInput.value.trim());
            window.location.href = `/reset-password?phone=${phone}`;
        } else {
            showMessage(data.detail || 'Failed to resend code. Please try again later.', 'error');
            linkEl.style.pointerEvents = 'auto';
            linkEl.textContent = 'Resend Code';
        }
    } catch (err) {
        showMessage('Network error. Please check your connection and try again.', 'error');
        linkEl.style.pointerEvents = 'auto';
        linkEl.textContent = 'Resend Code';
    }
}

linkEl.addEventListener('click', handleResend);

// Start the initial countdown on page load
startCountdown(60);
</script>
{% endblock %}
